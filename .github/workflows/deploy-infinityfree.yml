name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-infinityfree
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy via lftp
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history needed so per-file `git log` can resolve mtimes
          # (shallow clone would return empty for files not in HEAD)
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_mysql, bcmath, ctype, json, openssl, tokenizer, xml
          coverage: none

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets (Vite)
        run: |
          npm ci
          npm run build

      # InfinityFree silently drops PHP files > 1MB (often the optimized autoloader)
      - name: Shrink Composer autoloader
        run: |
          composer config optimize-autoloader false
          composer dump-autoload --no-dev

      - name: Clear local caches before upload
        run: |
          find bootstrap/cache -type f ! -name '.gitignore' -delete
          find storage/framework/cache -type f ! -name '.gitignore' -delete
          find storage/framework/sessions -type f ! -name '.gitignore' -delete
          find storage/framework/views -type f ! -name '.gitignore' -delete
          find storage/logs -type f ! -name '.gitignore' -delete
          rm -rf node_modules

      - name: Write production .env from secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::error::Secret ENV_FILE is empty or not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" > .env

      # actions/checkout resets every mtime to "now", which would make lftp
      # re-upload the whole tree on every push. Restore meaningful mtimes so
      # only genuinely changed files are transferred:
      #  - git-tracked files -> time of the last commit that touched them
      #  - vendor/           -> time of the last commit that touched composer.lock
      - name: Restore file mtimes for incremental sync
        run: |
          git ls-files | while IFS= read -r f; do
            [ -f "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f" 2>/dev/null || true)
            if [ -n "$t" ]; then
              touch -d "@$t" "$f"
            fi
          done
          if [ -d vendor ]; then
            t=$(git log -1 --format=%ct -- composer.lock 2>/dev/null || true)
            if [ -z "$t" ]; then
              t=$(date +%s)
            fi
            find vendor -exec touch -d "@$t" {} +
          fi

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy to InfinityFree via lftp
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          if [ -z "${FTP_USER:-}" ] || [ -z "${FTP_PASS:-}" ]; then
            echo "::error::FTP_USERNAME / FTP_PASSWORD secrets are not set."
            exit 1
          fi

          for attempt in 1 2 3; do
            if lftp -u "$FTP_USER","$FTP_PASS" ftpupload.net <<'LFTP_EOF'
          set cmd:fail-exit yes
          set cmd:verbose yes
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set net:timeout 30
          set net:max-retries 10
          set net:reconnect-interval-base 10
          set net:reconnect-interval-max 120
          set mirror:parallel-transfer-count 2

          # Pass 1: sync code + build output, delete files removed locally.
          # Never touch production-only data: user uploads, logs, sessions.
          # Regex excludes (not glob) keep each dir's .gitignore so the
          # directories still exist server-side on first deploy.
          # Views/cache are NOT excluded on purpose: local copies are cleared
          # above, so they get wiped server-side and recompiled fresh (avoids
          # stale compiled views referencing old paths).
          mirror --reverse --delete --verbose \
            --exclude-glob '.git/*' \
            --exclude-glob '.github/*' \
            --exclude-glob 'tests/*' \
            --exclude-glob 'database/*' \
            --exclude-glob 'test.php' \
            --exclude '^storage/app/public/[^.]' \
            --exclude '^storage/logs/[^.]' \
            --exclude '^storage/framework/sessions/[^.]' \
            ./ /htdocs/

          # Pass 2: upload tracked images without deleting server-only uploads
          mirror --reverse --verbose \
            ./storage/app/public/ /htdocs/storage/app/public/

          quit
          LFTP_EOF
          then
            echo "Deploy succeeded on attempt $attempt."
            exit 0
          fi
            echo "lftp attempt $attempt failed" >&2
            sleep 30
          done
          echo "::error::Deploy failed after 3 attempts"
          exit 1

      - name: Verify site responds
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set, skipping verification."
            exit 0
          fi
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::Site did not return HTTP 200 within 10 attempts"
          exit 1
